<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src * blob: data: file:; connect-src *; worker-src blob:; frame-src https:">
  <title>FloatView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-empty">
  <main id="stage">
    <video id="native" playsinline hidden></video>
  </main>

  <!-- Empty state / new-link sheet -->
  <section id="empty" aria-label="Open a link">
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><rect x="11.5" y="10" width="8" height="5.5" rx="1.2" class="fill"/></svg>
        <span>FloatView</span>
        <button class="icon ghost" id="empty-close" title="Back to video (Esc)" hidden>
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <form id="link-form" autocomplete="off">
        <input id="link-input" type="text" spellcheck="false"
               placeholder="Paste a video link — YouTube, Vimeo, Twitch, .mp4, .m3u8…" aria-label="Video link">
        <button type="submit" class="primary">Play</button>
      </form>
      <ul id="recent" aria-label="Recent links"></ul>
      <p class="hint">Tip: <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>V</kbd> opens this from anywhere · drop a link or file here</p>
    </div>
  </section>

  <!-- Top bar: drag handle + window buttons -->
  <header id="topbar" class="overlay">
    <span id="title">FloatView</span>
    <div class="buttons">
      <button class="icon" id="btn-new" title="Open new link (N)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button class="icon" id="btn-clickthrough" title="Click-through (Ctrl+Alt+T)"><svg viewBox="0 0 24 24"><path d="M5 3l6 16 2.2-6.8L20 10z"/><path d="M13.2 12.2L19 18"/></svg></button>
      <button class="icon" id="btn-pin" title="Always on top (Ctrl+Alt+P)"><svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg></button>
      <button class="icon" id="btn-mini" title="Mini size"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="5" class="fill"/></svg></button>
      <button class="icon" id="btn-settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
      <button class="icon danger" id="btn-close" title="Hide to tray (Ctrl+Alt+H)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>

  <!-- Bottom controls -->
  <footer id="controls" class="overlay">
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="row">
      <button class="icon" id="btn-play" title="Play / pause (Space)">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l13-7.5z" class="fill"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h4v16H7zM13 4h4v16h-4z" class="fill"/></svg>
      </button>
      <button class="icon" id="btn-mute" title="Mute (M)">
        <svg viewBox="0 0 24 24" class="i-vol"><path d="M4 9h4l5-4v14l-5-4H4z" class="fill"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg viewBox="0 0 24 24" class="i-muted"><path d="M4 9h4l5-4v14l-5-4H4z" class="fill"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
      <span id="time">0:00</span>
      <span class="spacer"></span>
      <label class="mini-label" title="Opacity (Ctrl+Alt+↑/↓)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
        <input id="opacity" type="range" min="20" max="100" value="100" aria-label="Opacity">
      </label>
      <select id="speed" title="Speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
        <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option><option value="2">2×</option><option value="2.5">2.5×</option><option value="3">3×</option>
      </select>
    </div>
  </footer>

  <div id="loading" hidden><div class="spinner"></div></div>

  <div id="error" hidden role="alert">
    <p id="error-text"></p>
    <div class="actions">
      <button id="error-browser" class="primary">Open in browser</button>
      <button id="error-new">Try another link</button>
    </div>
  </div>

  <!-- Click-through unlock handle -->
  <button id="lock-handle" title="Turn off click-through (Ctrl+Alt+T)">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </button>

  <aside id="settings" hidden aria-label="Settings">
    <div class="settings-head">
      <strong>Settings</strong>
      <button class="icon ghost" id="settings-close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="settings-body">
      <label>Default opacity <output id="o-opacity"></output>
        <input type="range" id="s-opacity" min="20" max="100"></label>
      <label>Opacity in click-through mode <output id="o-ct"></output>
        <input type="range" id="s-ct" min="10" max="100"></label>
      <label>Window shape
        <select id="s-aspect">
          <option value="auto">Match the video</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16 (Shorts, TikTok)</option>
          <option value="4:3">4:3</option>
          <option value="free">Free</option>
        </select></label>
      <label>Start corner
        <select id="s-corner">
          <option value="bottom-right">Bottom right</option><option value="bottom-left">Bottom left</option>
          <option value="top-right">Top right</option><option value="top-left">Top left</option>
        </select></label>
      <label class="check"><input type="checkbox" id="s-login"> Start with Windows</label>
      <label>yt-dlp.exe (optional — plays more sites)
        <span class="inline"><input type="text" id="s-ytdlp" placeholder="Not set" spellcheck="false">
          <button id="s-ytdlp-browse">Browse…</button></span></label>
      <div class="btn-row">
        <button id="s-clear-history">Clear history</button>
        <button id="s-clear-site">Clear site cookies</button>
        <button id="s-open-file" title="Hotkeys are edited here">Edit hotkeys…</button>
      </div>
      <p class="hint" id="s-hotkeys"></p>
      <div class="btn-row"><button id="s-quit" class="danger">Quit FloatView</button></div>
    </div>
  </aside>

  <div id="toast" hidden></div>

  <script src="../../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../../node_modules/dashjs/dist/modern/umd/dash.all.min.js"></script>
  <script src="players.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
